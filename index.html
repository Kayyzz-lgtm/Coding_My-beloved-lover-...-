<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💗 Teruntuk seseorang yang spesial di hidupku</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;overflow-x:hidden;
  display:flex;justify-content:center;align-items:center;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ff758c,#ff7eb3,#a18cd1);
}
.card{
  width:92%;max-width:500px;margin:25px 0;padding:30px;
  text-align:center;color:white;border-radius:30px;
  background:rgba(255,255,255,.18);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,.4);
  box-shadow:0 20px 50px rgba(0,0,0,.25);
  z-index:5;
}
.heart{font-size:75px;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.2)}}
h1{margin:10px 0 15px}
#typing{min-height:70px;line-height:1.6}
input{
  width:90%;padding:13px;margin:7px;border:0;border-radius:20px;
  outline:none;text-align:center;font-size:15px;
}
button{
  border:0;padding:13px 25px;margin:8px;border-radius:25px;
  cursor:pointer;font-size:16px;transition:.3s;
}
#yes{background:#ff2e63;color:white}
#yes:hover{transform:scale(1.1)}
#no{background:white;color:#ff2e63;position:relative}
#hasil{display:none;margin-top:20px;border-top:1px solid rgba(255,255,255,.4);padding-top:20px}
.quote{
  margin:14px 0;padding:16px;border-radius:18px;
  background:rgba(255,255,255,.15);line-height:1.6;
}
.status{margin-top:18px;line-height:1.9}
.floating{
  position:fixed;bottom:-50px;pointer-events:none;
  animation:up linear forwards;z-index:1;
}
@keyframes up{
  0%{transform:translateY(0) rotate(0);opacity:0}
  15%{opacity:1}
  100%{transform:translateY(-110vh) rotate(360deg);opacity:0}
}
</style>
</head>
<body>
<div class="card">
  <div class="heart">❤️</div>
  <h1>Teruntuk seseorang yang spesial di hidupku</h1>
  <p id="typing"></p>

  <input id="nama" placeholder="👤 Masukkan nama kamu">
  <input id="crush" placeholder="💘 Masukkan nama seorang spesial, harus aku ya">
  <br>

  <button id="yes" onclick="jawabYa()">💗 MAU</button>
  <button id="no">😭 TIDAK</button>

  <div id="hasil"></div>
</div>

<script>
const text="Katanya coding itu penuh logika... tapi kalau soal perasaan, hati sering tidak mengikuti algoritma. ❤️";
let i=0;
function ketik(){
  if(i<text.length){
    document.getElementById("typing").textContent+=text[i++];
    setTimeout(ketik,40);
  }
}
ketik();

document.getElementById("no").addEventListener("mouseover",function(){
  this.style.transform=`translate(${Math.random()*220-110}px,${Math.random()*150-75}px)`;
});

function jawabYa(){
  const nama=document.getElementById("nama").value.trim()||"Kamu";
  const crush=document.getElementById("crush").value.trim()||"Seorang Spesial, Harus Aku Ya";
  document.getElementById("hasil").style.display="block";
  document.getElementById("hasil").innerHTML=`
    <h2>💞 YEAY! 💞</h2>
    <div class="quote"><b>${nama} ❤️ ${crush}</b></div>
    <div class="quote">"Kalau hidup adalah sebuah program, aku ingin kamu menjadi bagian yang tidak pernah aku hapus." ❤️</div>
    <div class="quote">"Di antara jutaan kemungkinan, entah kenapa hatiku selalu memilih kamu." 💗</div>
    <div class="quote">"Kalau senyum kamu adalah error, aku tidak ingin memperbaikinya." 😆❤️</div>
    <div class="quote">"Kalau hati punya password, mungkin password-nya adalah namamu." 🔐❤️</div>
    <div class="status">
      💗 <b>STATUS</b><br>
      BUCIN MODE = TRUE<br>
      ❤️ HEART = CONNECTED<br>
      💞 FEELING = 100%<br>
      🔐 PASSWORD = ${crush}
    </div>`;
  buatHati(30);
}

function buatHati(jumlah){
  for(let i=0;i<jumlah;i++){
    const h=document.createElement("div");
    h.className="floating";
    h.textContent=["❤️","💗","💕","💖","💘"][Math.floor(Math.random()*5)];
    h.style.left=Math.random()*100+"vw";
    h.style.fontSize=15+Math.random()*30+"px";
    h.style.animationDuration=4+Math.random()*5+"s";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),9000);
  }
}
setInterval(()=>buatHati(1),700);
</script>
</body>
</html>
